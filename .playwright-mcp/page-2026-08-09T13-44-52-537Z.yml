  - generic [ref=e29]:
    - heading "Best right now" [level=3] [ref=e30]
    - paragraph [ref=e31]: Duluth, MN, Marquette, MI, and San Diego, CA are statistically tied for the best conditions today and tomorrow. Duluth posts a perfect 100 on 08-10 (hi 83, lo 61, 3% rain, 72% sun) after a 94.7 on 08-09. Marquette is nearly as strong with a 95.4 on 08-10 (hi 70, lo 58, 4% rain, 57% sun) and a 93.4 today. San Diego’s 08-09 is the best of the trio (95.2, hi 83, lo 69, 3% rain, 91% sun), though its 08-10 dips to 89.8 with only 36% sun. All three keep rain chances at or below 4% for the next two days.
    - heading "Best for the coming week" [level=3] [ref=e32]
    - paragraph [ref=e33]: Marquette, MI and San Luis Obispo, CA are tied for the best full-week outlook, both scoring 97.4. Marquette hits 100 on four of seven days (08-12 through 08-15) with highs in the 60s–70s, rain never above 23%, and sun frequently above 90%. San Luis Obispo posts 100 on six straight days (08-10 through 08-15) with highs in the 76–86 range, rain at or below 8%, and sun mostly 88–98%. This is a genuine tie; neither city separates itself over the week.
    - heading "Runners-up" [level=3] [ref=e34]
    - paragraph [ref=e35]: San Diego, CA (week 97.3) is the closest challenger, just 0.1 behind the week leaders. Its forecast is nearly flawless—rain never above 4%, sun mostly 79–97%—but a cloudy 08-10 (36% sun) and a slightly lower now score keep it out of the top spot. Duluth, MN (week 96.7) is also close, with a strong stretch of 100s on 08-10, 08-13, and 08-14, but its 08-15 drops to 83.4 (17% rain, 21% sun), which pulls its weekly average down.
    - heading "Why" [level=3] [ref=e36]
    - paragraph [ref=e37]: "The leaders are defined by consistently low rain and high sun, not extreme heat. Marquette’s week features highs of 63–76°F, rain chances of 3–23%, and sun from 57% to 98%—a cool, dry pattern. San Luis Obispo’s highs run 76–86°F with rain at 0–8% and sun mostly above 88%, offering warm, dry days. Duluth’s now-lead comes from a perfect 100 on 08-10 (hi 83, lo 61, 3% rain, 72% sun) and a 99.4 on 08-12 (hi 83, lo 60, 33% rain, 97% sun), though its 08-15 (17% rain, 21% sun) is the weak link. San Diego’s appeal is its reliability: rain never exceeds 4% all week, and highs stay in the 74–83°F range. The tie-breaker among the now leaders is negligible—all three have two-day rain chances under 5% and comfortable highs."
    - heading "Watch-outs" [level=3] [ref=e38]
    - paragraph [ref=e39]: "- Duluth, MN: 08-15 brings a 17% chance of rain (0.17 in) and only 21% sun—a cloudy, damp end to the week. Also, 08-10’s high of 83°F is a brief warm spike.- Marquette, MI: 08-11 has a 14% rain chance with 0.30 in possible, and 08-12 carries a 23% chance—both days still score 94.8 and 100, but packable rain gear is wise.- San Diego, CA: 08-10 is the only cloudy day (36% sun) with a high of 76°F; otherwise the week is dry and sunny.- San Luis Obispo, CA: 08-14 has an 8% rain chance (the week’s highest) but remains a 100-score day; no significant weather issues."
